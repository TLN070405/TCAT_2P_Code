[metadata]
name = TCAT2Phase
version = 0.1.0
description = Two-Phase Flow in Porous Media
author = Tom Nelson
platforms = unix, linux, osx, cygwin, win32
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
# petsc4py is also required but is not listed here: install it from conda-forge
# (see README), since pip would try to build PETSc from source.
install_requires =
    numpy>=1.22.3
    h5py
python_requires = >=3.9
package_dir =
    =src
zip_safe = no

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest>=6.0
    pytest-cov>=2.0
    mypy>=0.910
    flake8>=3.9
    tox>=3.24

[options.package_data]
slapping = py.typed

[flake8]
max-line-length = 160
[tool:pytest]
testpaths = tests
addopts = -m "not slow"
markers =
    slow: runs the real test-case driver scripts (a few minutes); run with: pytest -m slow
