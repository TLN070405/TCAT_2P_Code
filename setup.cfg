[metadata]
name = TCAT2Phase
description = Two-Phase Flow in Porous Media
author = Tom Nelson
platforms = unix, linux, osx, cygwin, win32
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9

[options]
packages =
    TCAT2Phase
install_requires =
    numpy>=1.22.3
    mpi4py>=3.1.3
python_requires = >=3.6
package_dir =
    =src
zip_safe = no

[options.extras_require]
testing =
    pytest>=6.0
    pytest-cov>=2.0
    mypy>=0.910
    flake8>=3.9
    tox>=3.24

[options.package_data]
slapping = py.typed

[flake8]
max-line-length = 160
[tool:pytest]
testpaths = tests
addopts = -m "not slow"
markers =
    slow: runs the real test-case driver scripts (a few minutes); run with: pytest -m slow
filterwarnings =
    ignore:Conversion of an array with ndim > 0 to a scalar:DeprecationWarning
